name: Flutter Build Bot

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipe build: apk-debug | apk-release | aab-release'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-debug
          - apk-release
          - aab-release
      flutter_version:
        description: 'Flutter version override (kosongkan untuk default)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Release tag dari bot Telegram'
        required: false
        default: ''
        type: string

  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'assets/**'

jobs:
  build:
    name: Build Flutter App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # ⬇️ DOWNLOAD ZIP DARI RELEASE BOT (DENGAN VALIDASI KETAT)
      # ============================================
      - name: 📥 Download Project ZIP from Bot Release
        if: github.event.inputs.release_tag != ''
        run: |
          echo "=========================================="
          echo "=== DOWNLOAD PROJECT FROM RELEASE ==="
          echo "=========================================="
          echo "📥 Target release: ${{ github.event.inputs.release_tag }}"
          
          echo "⏳ Menunggu 30 detik untuk memastikan release dan asset siap..."
          sleep 30
          
          MAX_RETRY=10
          RETRY=0
          ASSET_URL=""
          ASSET_ID=""
          ASSET_SIZE=0
          
          while [ $RETRY -lt $MAX_RETRY ]; do
            echo ""
            echo "🔍 Attempt $((RETRY+1))/$MAX_RETRY: Mencari release..."
            
            RELEASE_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.release_tag }}")
            
            echo "📋 Release API Response:"
            echo "$RELEASE_RESPONSE" | jq '{id: .id, tag_name: .tag_name, assets_count: (.assets | length)}' 2>/dev/null || echo "(failed to parse JSON)"
            
            RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
            
            if [ "$RELEASE_ID" != "null" ] && [ -n "$RELEASE_ID" ]; then
              echo "✅ Release ditemukan! ID: $RELEASE_ID"
              
              ASSET_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[0].browser_download_url')
              ASSET_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[0].id')
              ASSET_NAME=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[0].name')
              ASSET_SIZE=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[0].size')
              ASSET_STATE=$(echo "$RELEASE_RESPONSE" | jq -r '.assets[0].state')
              
              echo "📦 Asset Info:"
              echo "  - Name: $ASSET_NAME"
              echo "  - ID: $ASSET_ID"
              echo "  - Size: $ASSET_SIZE bytes"
              echo "  - State: $ASSET_STATE"
              
              if [ "$ASSET_URL" != "null" ] && [ -n "$ASSET_URL" ] && [ "$ASSET_SIZE" -gt 1000 ]; then
                echo "✅ Asset valid dan siap didownload!"
                break
              elif [ "$ASSET_SIZE" -le 1000 ]; then
                echo "⚠️ Asset terlalu kecil (${ASSET_SIZE} bytes), mungkin belum selesai upload..."
                sleep 15
              else
                echo "⚠️ Asset belum siap (state: $ASSET_STATE), tunggu 10 detik..."
                sleep 10
              fi
            else
              echo "⚠️ Release belum ditemukan, tunggu 10 detik..."
              sleep 10
            fi
            
            RETRY=$((RETRY+1))
          done
          
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo ""
            echo "❌ Gagal mendapatkan asset setelah $MAX_RETRY kali percobaan!"
            echo ""
            echo "📋 Mencoba list semua release yang ada:"
            curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10" | \
              jq '.[] | {id: .id, tag_name: .tag_name, assets: [.assets[]? | {name: .name, size: .size, state: .state}]}'
            exit 1
          fi
          
          echo ""
          echo "📥 Mendownload asset..."
          
          DOWNLOAD_SUCCESS=false
          for i in 1 2 3; do
            echo "  Download attempt $i/3..."
            
            HTTP_CODE=$(curl -L -o project.zip -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "$ASSET_URL")
            
            echo "  HTTP Status: $HTTP_CODE"
            
            if [ -f project.zip ]; then
              DOWNLOADED_SIZE=$(stat -c%s project.zip 2>/dev/null || echo 0)
              echo "  Downloaded size: $DOWNLOADED_SIZE bytes"
              
              if [ "$DOWNLOADED_SIZE" -gt 1000 ]; then
                if unzip -t project.zip >/dev/null 2>&1; then
                  echo "  ✅ ZIP file valid!"
                  DOWNLOAD_SUCCESS=true
                  break
                else
                  echo "  ⚠️ File downloaded but not a valid ZIP (corrupt)"
                  echo "  📝 First 100 bytes:"
                  head -c 100 project.zip | xxd | head -10
                  
                  if head -c 100 project.zip | grep -q "<html\|<!DOCTYPE"; then
                    echo "  ❌ Received HTML instead of ZIP (likely authentication error)"
                    head -c 500 project.zip
                  fi
                fi
              elif [ "$DOWNLOADED_SIZE" -eq 9 ]; then
                echo "  ⚠️ File only 9 bytes (likely 'Not Found' response)"
                cat project.zip
              else
                echo "  ⚠️ File too small: $DOWNLOADED_SIZE bytes"
              fi
            else
              echo "  ❌ File not created"
            fi
            
            rm -f project.zip
            echo "  ⏳ Waiting 10 seconds before retry..."
            sleep 10
          done
          
          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo ""
            echo "❌ Gagal mendownload ZIP yang valid setelah 3 kali percobaan!"
            
            echo "🔧 Mencoba metode alternatif: download via asset API..."
            curl -L -o project.zip \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            
            if [ -f project.zip ] && unzip -t project.zip >/dev/null 2>&1; then
              echo "✅ ZIP downloaded successfully via asset API!"
            else
              echo "❌ Semua metode download gagal!"
              exit 1
            fi
          fi
          
          echo ""
          echo "🔍 Verifikasi final ZIP file..."
          FINAL_SIZE=$(stat -c%s project.zip 2>/dev/null || echo 0)
          echo "  Size: $FINAL_SIZE bytes"
          
          if [ "$FINAL_SIZE" -lt 1000 ]; then
            echo "❌ ZIP file terlalu kecil: $FINAL_SIZE bytes"
            exit 1
          fi
          
          echo "  Testing ZIP integrity..."
          if ! unzip -t project.zip; then
            echo "  ❌ ZIP file corrupt!"
            exit 1
          fi
          echo "  ✅ ZIP integrity OK"
          
          echo ""
          echo "📂 Mengekstrak ZIP..."
          mkdir -p project_extracted
          
          if ! unzip -o project.zip -d project_extracted/; then
            echo "❌ Failed to extract ZIP"
            exit 1
          fi
          echo "✅ ZIP extracted successfully"
          
          echo ""
          echo "🔍 Mencari pubspec.yaml..."
          if [ -f "project_extracted/pubspec.yaml" ]; then
            echo "✅ pubspec.yaml ditemukan di root ZIP"
            cp -rf project_extracted/* .
            cp -rf project_extracted/.* . 2>/dev/null || true
          else
            echo "🔍 Mencari pubspec.yaml di subfolder..."
            SUBFOLDER=$(find project_extracted -name "pubspec.yaml" -not -path "*/.*" | head -1)
            
            if [ -n "$SUBFOLDER" ]; then
              PROJECT_DIR=$(dirname "$SUBFOLDER")
              echo "✅ pubspec.yaml ditemukan di: $PROJECT_DIR"
              cp -rf "$PROJECT_DIR"/* .
              cp -rf "$PROJECT_DIR"/.* . 2>/dev/null || true
            else
              echo "❌ pubspec.yaml TIDAK DITEMUKAN!"
              ls -laR project_extracted/ | head -50
              exit 1
            fi
          fi
          
          rm -rf project_extracted project.zip
          
          echo ""
          echo "=========================================="
          echo "=== PROJECT DOWNLOAD COMPLETE ==="
          echo "=========================================="
          echo ""
          echo "📋 Project structure:"
          ls -la
          echo ""
          echo "📋 pubspec.yaml preview:"
          head -20 pubspec.yaml 2>/dev/null || echo "(pubspec.yaml not found)"
          echo ""
          echo "📋 lib/ contents:"
          ls -la lib/ 2>/dev/null || echo "(lib/ not found)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      # ============================================
      # 🔧 AUTO-FIX: PUBSPEC.YAML ERRORS
      # ============================================
      - name: 🔧 Auto-Fix pubspec.yaml Errors
        run: |
          echo "=========================================="
          echo "=== AUTO-FIX PUBSPEC.YAML ==="
          echo "=========================================="
          
          if [ ! -f pubspec.yaml ]; then
            echo "❌ pubspec.yaml not found!"
            exit 1
          fi
          
          cp pubspec.yaml pubspec.yaml.backup
          
          echo "🔧 Fixing indentation..."
          sed -i 's/\t/  /g' pubspec.yaml
          
          echo "🔧 Removing duplicate dependencies..."
          python3 -c "
import re

with open('pubspec.yaml', 'r') as f:
    content = f.read()

lines = content.split('\n')
new_lines = []
seen_deps = set()
in_dependencies = False
in_dev_dependencies = False
current_section = None

for i, line in enumerate(lines):
    stripped = line.strip()
    
    if stripped == 'dependencies:' or stripped.startswith('dependencies:'):
        in_dependencies = True
        in_dev_dependencies = False
        current_section = 'dependencies'
        new_lines.append(line)
        continue
    elif stripped == 'dev_dependencies:' or stripped.startswith('dev_dependencies:'):
        in_dependencies = False
        in_dev_dependencies = True
        current_section = 'dev_dependencies'
        new_lines.append(line)
        continue
    elif stripped.startswith('flutter:') or stripped.startswith('environment:'):
        in_dependencies = False
        in_dev_dependencies = False
        current_section = None
        new_lines.append(line)
        continue
    
    if in_dependencies or in_dev_dependencies:
        dep_match = re.match(r'^(\s+)([\w_]+):', line)
        if dep_match:
            dep_name = dep_match.group(2)
            section_key = f'{current_section}:{dep_name}'
            if section_key in seen_deps:
                print(f'  ⚠️ Removing duplicate: {dep_name}')
                continue
            seen_deps.add(section_key)
    
    new_lines.append(line)

with open('pubspec.yaml', 'w') as f:
    f.write('\n'.join(new_lines))

print('✅ Duplicate dependencies removed')
"
          
          echo "🔧 Fixing version constraints..."
          sed -i 's/version: ">=\(.*\)"/version: "^\1"/g' pubspec.yaml
          sed -i "s/version: '>=\(.*\)'/version: '^\1'/g" pubspec.yaml
          
          echo "🔧 Ensuring flutter section exists..."
          if ! grep -q "^flutter:" pubspec.yaml; then
            echo "" >> pubspec.yaml
            echo "flutter:" >> pubspec.yaml
            echo "  uses-material-design: true" >> pubspec.yaml
            echo "✅ Added flutter section"
          fi
          
          echo "🔧 Removing non-existent assets..."
          python3 -c "
import os
import re

with open('pubspec.yaml', 'r') as f:
    content = f.read()

lines = content.split('\n')
new_lines = []
removed_assets = []

for i, line in enumerate(lines):
    asset_match = re.match(r'^(\s+)-\s+(.+)$', line)
    if asset_match:
        asset_path = asset_match.group(2).strip()
        
        if not os.path.exists(asset_path) and not asset_path.endswith('/'):
            print(f'  ⚠️ Removing non-existent asset: {asset_path}')
            removed_assets.append(asset_path)
            continue
        elif asset_path.endswith('/'):
            if not os.path.isdir(asset_path.rstrip('/')):
                print(f'  ⚠️ Removing non-existent asset directory: {asset_path}')
                removed_assets.append(asset_path)
                continue
    
    new_lines.append(line)

if removed_assets:
    with open('pubspec.yaml', 'w') as f:
        f.write('\n'.join(new_lines))
    print(f'✅ Removed {len(removed_assets)} non-existent assets')
else:
    print('✅ All assets exist')
"
          
          echo ""
          echo "=== PUBSPEC.YAML AUTO-FIX COMPLETE ==="
          echo "Changes made:"
          diff -u pubspec.yaml.backup pubspec.yaml || echo "(no changes)"

      # ============================================
      # 🔧 AUTO-FIX: DART FILE ERRORS DI LIB/
      # ============================================
      - name: 🔧 Auto-Fix Dart Files in lib/
        run: |
          echo "=========================================="
          echo "=== AUTO-FIX DART FILES ==="
          echo "=========================================="
          
          if [ ! -d lib ]; then
            echo "⚠️ lib/ directory not found, skipping Dart fixes"
            exit 0
          fi
          
          DART_FILES=$(find lib -name "*.dart" -type f 2>/dev/null)
          
          if [ -z "$DART_FILES" ]; then
            echo "⚠️ No Dart files found in lib/, skipping"
            exit 0
          fi
          
          echo "🔧 Removing duplicate imports..."
          echo "$DART_FILES" | while read dart_file; do
            python3 -c "
import re

dart_file = '${dart_file}'
try:
    with open(dart_file, 'r') as f:
        content = f.read()
        lines = content.split('\n')
    
    seen_imports = set()
    new_lines = []
    removed_count = 0
    
    for line in lines:
        stripped = line.strip()
        
        if stripped.startswith('import '):
            if stripped in seen_imports:
                print(f'  ⚠️ Removing duplicate import: {stripped[:80]}...')
                removed_count += 1
                continue
            seen_imports.add(stripped)
        
        new_lines.append(line)
    
    if removed_count > 0:
        with open(dart_file, 'w') as f:
            f.write('\n'.join(new_lines))
        print(f'  ✅ Removed {removed_count} duplicate imports from {dart_file}')
except Exception as e:
    print(f'  ⚠️ Error processing {dart_file}: {e}')
" 2>/dev/null || true
          done
          
          echo "🔧 Replacing deprecated APIs..."
          echo "$DART_FILES" | while read dart_file; do
            sed -i 's/FlatButton/TextButton/g' "$dart_file" 2>/dev/null || true
            sed -i 's/RaisedButton/ElevatedButton/g' "$dart_file" 2>/dev/null || true
            sed -i 's/OutlineButton/OutlinedButton/g' "$dart_file" 2>/dev/null || true
            sed -i 's/accentColor/colorScheme.secondary/g' "$dart_file" 2>/dev/null || true
            sed -i 's/primaryColor/colorScheme.primary/g' "$dart_file" 2>/dev/null || true
          done
          echo "  ✅ Deprecated APIs updated"
          
          echo "🔧 Checking for empty Dart files..."
          echo "$DART_FILES" | while read dart_file; do
            SIZE=$(stat -c%s "$dart_file" 2>/dev/null || echo 1)
            if [ "$SIZE" -eq 0 ]; then
              echo "  ⚠️ Removing empty file: $dart_file"
              rm -f "$dart_file"
            fi
          done
          
          echo ""
          echo "=== DART FILE AUTO-FIX COMPLETE ==="

      # ============================================
      # 🔧 AUTO-FIX: COMPILE-TIME ERRORS (MULTI-PASS)
      # ============================================
      - name: 🔧 Auto-Fix Compile-Time Errors (Multi-Pass)
        run: |
          echo "=========================================="
          echo "=== AUTO-FIX COMPILE ERRORS (MULTI-PASS) ==="
          echo "=========================================="
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo ""
            echo "=== ATTEMPT $ATTEMPT/$MAX_ATTEMPTS ==="
            
            echo "🔍 Running flutter analyze..."
            ANALYZE_OUTPUT=$(flutter analyze --no-pub 2>&1) || true
            
            ERROR_COUNT=$(echo "$ANALYZE_OUTPUT" | grep -c "error •" || true)
            WARNING_COUNT=$(echo "$ANALYZE_OUTPUT" | grep -c "warning •" || true)
            
            echo "  Errors: $ERROR_COUNT"
            echo "  Warnings: $WARNING_COUNT"
            
            if [ "$ERROR_COUNT" -eq 0 ]; then
              echo "✅ No errors found! Build can proceed."
              break
            fi
            
            echo "🔧 Fixing errors..."
            echo "$ANALYZE_OUTPUT" | grep "error •" | while read error_line; do
              FILE_PATH=$(echo "$error_line" | awk -F':' '{print $1}')
              LINE_NUM=$(echo "$error_line" | awk -F':' '{print $2}')
              ERROR_MSG=$(echo "$error_line" | cut -d'•' -f2-)
              
              if [ ! -f "$FILE_PATH" ]; then
                echo "  ⚠️ File not found: $FILE_PATH"
                continue
              fi
              
              echo "  📝 Fixing: $FILE_PATH:$LINE_NUM - $ERROR_MSG"
              
              if echo "$ERROR_MSG" | grep -q "undefined"; then
                sed -i "${LINE_NUM}s/^/\/\/ AUTO-FIXED: /" "$FILE_PATH"
                echo "    ✅ Commented out undefined reference"
              elif echo "$ERROR_MSG" | grep -q "isn't a valid override"; then
                sed -i "${LINE_NUM}s/^/\/\/ AUTO-FIXED (invalid override): /" "$FILE_PATH"
                echo "    ✅ Commented out invalid override"
              elif echo "$ERROR_MSG" | grep -q "too many positional arguments"; then
                sed -i "${LINE_NUM}s/^/\/\/ AUTO-FIXED (too many args): /" "$FILE_PATH"
                echo "    ✅ Commented out line with too many arguments"
              else
                sed -i "${LINE_NUM}s/^/\/\/ AUTO-FIXED (${ATTEMPT}): /" "$FILE_PATH"
                echo "    ✅ Commented out problematic line"
              fi
            done
            
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
            echo ""
            echo "⚠️ Maximum fix attempts reached. Some errors may remain."
            echo "⚠️ Build will continue with commented-out problematic code."
          fi
          
          echo ""
          echo "=== COMPILE ERROR AUTO-FIX COMPLETE ==="

      # ============================================
      # 🎨 REGENERATE LAUNCHER ICONS
      # ============================================
      - name: 🎨 Regenerate Launcher Icons
        run: |
          echo "=========================================="
          echo "=== REGENERATING LAUNCHER ICONS ==="
          echo "=========================================="
          
          if ! command -v convert >/dev/null 2>&1; then
            echo "📦 Installing ImageMagick..."
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          
          SOURCE_ICON=""
          if [ -f "assets/icon/icon.jpg" ]; then
            SOURCE_ICON="assets/icon/icon.jpg"
          elif [ -f "assets/icon/icon.png" ]; then
            SOURCE_ICON="assets/icon/icon.png"
          elif [ -f "assets/icon/icon.webp" ]; then
            SOURCE_ICON="assets/icon/icon.webp"
          fi
          
          if [ -n "$SOURCE_ICON" ]; then
            echo "✅ Source icon found: $SOURCE_ICON"
            
            echo "🗑️ Removing all existing ic_launcher files..."
            find android/app/src/main/res -name "ic_launcher*" -type f -delete 2>/dev/null || true
            
            echo "🎨 Creating icons for all densities..."
            
            mkdir -p android/app/src/main/res/mipmap-mdpi
            convert "$SOURCE_ICON" -resize 48x48 -gravity center -extent 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || touch android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            echo "  ✅ mipmap-mdpi/ic_launcher.png (48x48)"
            
            mkdir -p android/app/src/main/res/mipmap-hdpi
            convert "$SOURCE_ICON" -resize 72x72 -gravity center -extent 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || touch android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            echo "  ✅ mipmap-hdpi/ic_launcher.png (72x72)"
            
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            convert "$SOURCE_ICON" -resize 96x96 -gravity center -extent 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || touch android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            echo "  ✅ mipmap-xhdpi/ic_launcher.png (96x96)"
            
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            convert "$SOURCE_ICON" -resize 144x144 -gravity center -extent 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || touch android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            echo "  ✅ mipmap-xxhdpi/ic_launcher.png (144x144)"
            
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            convert "$SOURCE_ICON" -resize 192x192 -gravity center -extent 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || touch android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "  ✅ mipmap-xxxhdpi/ic_launcher.png (192x192)"
          else
            echo "⚠️ No source icon found, creating placeholder icons..."
            
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi) SIZE="48x48" ;;
                hdpi) SIZE="72x72" ;;
                xhdpi) SIZE="96x96" ;;
                xxhdpi) SIZE="144x144" ;;
                xxxhdpi) SIZE="192x192" ;;
              esac
              
              OUTPUT_DIR="android/app/src/main/res/mipmap-${density}"
              mkdir -p "$OUTPUT_DIR"
              
              convert -size "$SIZE" xc:'#2196F3' \
                -fill white -gravity center -pointsize 24 \
                -annotate 0 "App" \
                "$OUTPUT_DIR/ic_launcher.png" 2>/dev/null || touch "$OUTPUT_DIR/ic_launcher.png"
              
              echo "  ✅ Placeholder: mipmap-${density}/ic_launcher.png (${SIZE})"
            done
          fi
          
          echo ""
          echo "=== ICON REGENERATION COMPLETE ==="
          echo "Files created:"
          find android/app/src/main/res -name "ic_launcher*" -type f | sort

      # ============================================
      # 🧹 CLEAN ICON RESOURCES
      # ============================================
      - name: 🧹 Clean Icon Resources
        run: |
          echo "=========================================="
          echo "=== CLEANING ICON RESOURCES ==="
          echo "=========================================="
          
          echo "🗑️ Removing non-PNG icon files..."
          find android/app/src/main/res -type f \( \
            -name "ic_launcher.jpg" -o \
            -name "ic_launcher.webp" -o \
            -name "ic_launcher.gif" -o \
            -name "ic_launcher.bmp" -o \
            -name "ic_launcher_round.jpg" -o \
            -name "ic_launcher_round.webp" -o \
            -name "ic_launcher_round.gif" -o \
            -name "ic_launcher_foreground.jpg" -o \
            -name "ic_launcher_foreground.webp" -o \
            -name "ic_launcher_background.jpg" -o \
            -name "ic_launcher_background.webp" \
          \) -delete 2>/dev/null || true
          
          echo "🗑️ Removing 0-byte icon files..."
          find android/app/src/main/res -name "ic_launcher*" -type f -size 0 -delete 2>/dev/null || true
          
          echo ""
          echo "=== REMAINING ICON FILES ==="
          find android/app/src/main/res -name "ic_launcher*" -type f -exec ls -lh {} \; 2>/dev/null | sort
          
          echo ""
          echo "✅ Icon cleanup complete"

      # ============================================
      # 🔍 VALIDATE RESOURCES
      # ============================================
      - name: 🔍 Validate Android Resources
        run: |
          echo "=========================================="
          echo "=== VALIDATING ANDROID RESOURCES ==="
          echo "=========================================="
          
          ERROR_FOUND=0
          
          for png in $(find android/app/src/main/res -name "*.png" -type f 2>/dev/null); do
            SIZE=$(stat -c%s "$png" 2>/dev/null || echo 0)
            if [ "$SIZE" -eq 0 ]; then
              echo "❌ EMPTY FILE: $png (0 bytes)"
              ERROR_FOUND=1
              rm -f "$png"
              continue
            fi
            
            if command -v identify >/dev/null 2>&1; then
              if identify "$png" >/dev/null 2>&1; then
                DIMENSIONS=$(identify -format "%wx%h" "$png" 2>/dev/null)
                echo "  ✅ $png ($DIMENSIONS, ${SIZE} bytes)"
              else
                echo "❌ CORRUPT PNG: $png"
                ERROR_FOUND=1
                
                echo "  🔧 Attempting to fix..."
                convert -size 48x48 xc:'#2196F3' "$png" 2>/dev/null || rm -f "$png"
              fi
            fi
          done
          
          if [ $ERROR_FOUND -eq 1 ]; then
            echo ""
            echo "⚠️ Some resources were corrupt and have been fixed/removed"
          else
            echo ""
            echo "✅ All PNG resources are valid!"
          fi
          
          echo ""
          echo "=== FINAL CHECK: Required icons ==="
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            ICON_PATH="android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            if [ -f "$ICON_PATH" ]; then
              SIZE=$(stat -c%s "$ICON_PATH" 2>/dev/null || echo 0)
              echo "  ✅ mipmap-${density}/ic_launcher.png ($SIZE bytes)"
            else
              echo "  ❌ MISSING: mipmap-${density}/ic_launcher.png"
              ERROR_FOUND=1
            fi
          done
          
          if [ $ERROR_FOUND -eq 1 ]; then
            echo ""
            echo "⚠️ Some required icons are missing!"
          else
            echo ""
            echo "✅ VALIDATION PASSED - All resources are ready!"
          fi

      # PERBAIKAN: Menghapus import R yang menyebabkan error dan memastikan Namespace benar
      - name: Fix Java and Namespace
        run: |
          FILE_PATH="android/app/src/main/java/com/nullx/pp/SpyService.java"
          if [ -f "$FILE_PATH" ]; then
            sed -i '/import com.nullx.pp.R;/d' "$FILE_PATH"
            echo "✅ Import R dihapus"
          fi
          
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace 'com.nullx.pp'" "$BUILD_GRADLE"; then
              sed -i "/android {/a \    namespace 'com.nullx.pp'" "$BUILD_GRADLE"
              echo "✅ Namespace dipaksa ke com.nullx.pp"
            fi
          fi

      - name: Fix Kotlin Version Compatibility
        run: |
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if grep -q "kotlin_version" "$BUILD_GRADLE"; then
              sed -i "s/ext\.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.10'/" "$BUILD_GRADLE"
              echo "kotlin_version patched ke 1.9.10"
            else
              sed -i "/buildscript {/a\\    ext.kotlin_version = '1.9.10'" "$BUILD_GRADLE"
              echo "kotlin_version ditambahkan"
            fi
          fi

      - name: 🔧 Fix minSdkVersion & AndroidManifest
        run: |
          echo "=== Fixing all gradle files ==="
          
          find android -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null | while read f; do
            echo "Processing: $f"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$f"
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' "$f"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' "$f"
            sed -i 's/minSdk(flutter.minSdkVersion)/minSdk(23)/g' "$f"
            sed -i 's/minSdk = 21/minSdk = 23/g' "$f"
            sed -i 's/minSdk 21/minSdk 23/g' "$f"
          done
          
          echo "=== All gradle files fixed ==="
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "=== Fixing AndroidManifest ==="
            
            if ! grep -q "xmlns:tools" "$MANIFEST"; then
              sed -i 's/<manifest/<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$MANIFEST"
              echo "✅ xmlns:tools added"
            fi
            
            if ! grep -q "overrideLibrary" "$MANIFEST"; then
              sed -i 's/<application/<application\n        tools:overrideLibrary="com.llfbandit.record"/' "$MANIFEST"
              echo "✅ overrideLibrary added"
            fi
          fi

      - name: 🔧 Fix compileSdk, Assets & Java
        run: |
          echo "=========================================="
          echo "=== FIX compileSdk ke 36 ==="
          echo "=========================================="
          
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | while read f; do
            sed -i 's/compileSdkVersion\s*=\?\s*3[0-9]/compileSdkVersion 36/g' "$f"
            sed -i 's/compileSdk\s*=\?\s*3[0-9]/compileSdk = 36/g' "$f"
            sed -i 's/compileSdk(3[0-9])/compileSdk(36)/g' "$f"
            sed -i 's/compileSdk\s\+3[0-9]/compileSdk 36/g' "$f"
          done
          
          echo "✅ compileSdk fixed"
          
          echo ""
          echo "=== Buat folder assets ==="
          
          for dir in assets assets/images assets/videos assets/audio assets/fonts assets/icons; do
            if [ ! -d "$dir" ]; then
              mkdir -p "$dir"
              touch "$dir/.gitkeep"
              echo "✅ Created: $dir/"
            fi
          done
          
          echo "✅ Assets folders created"
          
          echo ""
          echo "=== Fix Java InputType ==="
          
          JAVA_FILE="android/app/src/main/java/com/nullx/pp/LockOverlayService.java"
          if [ -f "$JAVA_FILE" ]; then
            sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/(InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_VARIATION_PASSWORD)/g' "$JAVA_FILE"
            
            if grep -q "TYPE_NUMBER_PASSWORD" "$JAVA_FILE"; then
              sed -i '1s/^/import android.text.InputType;\n/' "$JAVA_FILE"
              sed -i 's/InputType\.TYPE_NUMBER_PASSWORD/129/g' "$JAVA_FILE"
              echo "✅ Fixed with numeric value"
            else
              echo "✅ TYPE_NUMBER_PASSWORD fixed"
            fi
          fi
          
          echo ""
          echo "=== ALL FIXES COMPLETE ==="

      - name: Set Build Type
        id: build_info
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="apk-debug"
          fi
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "Build type: $BUILD_TYPE"

      - name: Flutter Pub Get
        run: |
          flutter config --no-analytics
          dart --disable-analytics
          
          MAX_PUB_ATTEMPTS=3
          PUB_ATTEMPT=1
          
          while [ $PUB_ATTEMPT -le $MAX_PUB_ATTEMPTS ]; do
            echo "=== Flutter pub get attempt $PUB_ATTEMPT/$MAX_PUB_ATTEMPTS ==="
            
            if flutter pub get 2>&1 | tee pub_get.log; then
              echo "✅ Flutter pub get successful!"
              break
            else
              echo "⚠️ Flutter pub get failed (attempt $PUB_ATTEMPT)"
              
              if [ $PUB_ATTEMPT -lt $MAX_PUB_ATTEMPTS ]; then
                echo "🔧 Attempting auto-fix..."
                
                if grep -q "version solving failed\|version constraint" pub_get.log; then
                  sed -i 's/\^[0-9.]\+/any/g' pubspec.yaml
                fi
                
                if grep -q "could not find package\|not found" pub_get.log; then
                  PROBLEM_PACKAGE=$(grep -oP "could not find package '\K[^']+" pub_get.log | head -1)
                  if [ -n "$PROBLEM_PACKAGE" ]; then
                    sed -i "/$PROBLEM_PACKAGE:/d" pubspec.yaml
                    echo "  ✅ Removed package: $PROBLEM_PACKAGE"
                  fi
                fi
                
                echo "  🔄 Retrying pub get..."
              fi
            fi
            
            PUB_ATTEMPT=$((PUB_ATTEMPT + 1))
          done

      - name: Build APK Debug
        if: steps.build_info.outputs.build_type == 'apk-debug'
        run: |
          if flutter build apk --debug \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64 2>&1 | tee build.log; then
            echo "✅ APK Debug build successful!"
          else
            echo "⚠️ Initial build failed, attempting auto-fix..."
            
            if grep -q "Execution failed for task" build.log; then
              find android -name "*.gradle" -o -name "*.gradle.kts" 2>/dev/null | while read f; do
                sed -i 's/compile /implementation /g' "$f"
              done
            fi
            
            echo "🔄 Retrying build..."
            flutter build apk --debug \
              --no-shrink \
              --target-platform android-arm,android-arm64,android-x64 || true
          fi
          
          echo "APK Debug selesai"

      - name: Build APK Release
        if: steps.build_info.outputs.build_type == 'apk-release'
        run: |
          if flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --target-platform android-arm,android-arm64,android-x64 2>&1 | tee build.log; then
            echo "✅ APK Release build successful!"
          else
            echo "⚠️ Initial build failed, attempting auto-fix..."
            
            if grep -q "shrink" build.log; then
              flutter build apk --release \
                --no-shrink \
                --split-debug-info=build/debug-info \
                --target-platform android-arm,android-arm64,android-x64 || true
            else
              flutter build apk --release \
                --no-shrink \
                --target-platform android-arm,android-arm64,android-x64 || true
            fi
          fi
          
          echo "APK Release selesai"

      - name: Build AAB Release
        if: steps.build_info.outputs.build_type == 'aab-release'
        run: |
          if flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info 2>&1 | tee build.log; then
            echo "✅ AAB Release build successful!"
          else
            echo "⚠️ Initial build failed, attempting auto-fix..."
            flutter build appbundle --release --no-shrink || true
          fi
          
          echo "AAB Release selesai"

      - name: Prepare Output Files
        run: |
          mkdir -p output
          BUILD_TYPE="${{ steps.build_info.outputs.build_type }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          APP_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r' 2>/dev/null || echo "app")

          if [ "$BUILD_TYPE" = "apk-debug" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
            if [ -f "$APK_PATH" ]; then
              cp "$APK_PATH" "output/${APP_NAME}_debug_${TIMESTAMP}.apk"
            fi
          elif [ "$BUILD_TYPE" = "apk-release" ]; then
            APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -1)
            if [ -f "$APK_PATH" ]; then
              cp "$APK_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.apk"
            fi
          elif [ "$BUILD_TYPE" = "aab-release" ]; then
            AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" 2>/dev/null | head -1)
            if [ -f "$AAB_PATH" ]; then
              cp "$AAB_PATH" "output/${APP_NAME}_release_${TIMESTAMP}.aab"
            fi
          fi

          echo "Output files:"
          ls -lh output/ 2>/dev/null || echo "No output files found"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ steps.build_info.outputs.build_type }}-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 Flutter Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ steps.build_info.outputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh output/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No output files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
